<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empleado - AutoService</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/drawer.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/cards.css">
</head>

<body> <!--persistent objects-->
  <header> <!-- Top bar-->
    <div id="open-drawer">
      AutoService
    </div>
    <nav>
      <a id="goto-dashboard" href="#">Dashboard</a>
      <a id="goto-inventario" href="#">Inventario</a>
      <a id="goto-reportes" href="#">Reportes</a>
    </nav>
    <div>
      <span>icon</span>
      <span>UserName</span>
    </div>
  </header>

  <aside id="drawer"> <!--left bar-->
    <div>
      <span>AutoService</span>
      <button type="button" id="close-drawer">x</button>
    </div>
    <ul> <!-- list-->
      <li>
        <a id="goto-empleados" href="#">Empleados</a>
      </li>
      <li>
        <a id="goto-vehiculos" href="#">Vehiculos</a>
      </li>
      <li>
        <a id="goto-clientes" href="#">Clientes</a>
      </li>
      <li>
        <a id="goto-servicios" href="#">Servicios</a>
      </li>
    </ul>
  </aside>
  <div id="overlay"> <!--dark background in the bar--> </div>

  <main id="main-content">
    <section id="view-dashboard">
      <section class="hero" id="empleados-hero">
        <form id="search-form">
          <input type="search" id="search-input" , placeholder="buscar empleados por ID, Email">
          <button type="submit" id="button-empleados-buscar">Buscar</button>
        </form>
      </section>
      <section id="cards-grid">
      </section>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/drawer.js"></script>
  <script src="../js/pages/empleados.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
