<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoService</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/drawer.css">
  <link rel="stylesheet" href="css/cards.css">
</head>

<body> <!--persistent objects-->
  <header> <!-- Top bar-->
    <div id="open-drawer">
      AutoService
    </div>
    <nav>
      <a href="#">Dashboard</a>
      <a href="#">Inventario</a>
      <a href="#">Reportes</a>
    </nav>
    <div>
      <span>icon</span>
      <span>UserName</span>
    </div>
  </header>

  <aside id="drawer"> <!--left bar-->
    <div>
      <span>AutoService</span>
      <button type="button" id="close-drawer">x</button>
    </div>
    <ul> <!-- list-->
      <li>
        <a href="#">Mecanicos</a>
      </li>
      <li>
        <a href="#">Vehiculos</a>
      </li>
      <li>
        <a href="#">Clientes</a>
      </li>
      <li>
        <a href="#">Servicios</a>
      </li>
    </ul>
  </aside>
  <div id="overlay"> <!--dark background in the bar--> </div>

  <main id="main-content">
    <section id="view-dashboard">
      <section class="hero">
        <form id="search-form">
          <input type="search" id="search-input" , placeholder="buscar por ID, vehiculo, mecanico, etc">
          <button type="submit">Buscar</button>
        </form>
      </section>

      <section id="filters">
        <select id="filter-estado">
          <option value="">Todos</option>
          <option value="EN_PROCESO">En proceso</option>
          <option value="PENDIENTE">Pendiente</option>
          <option value="FINALIZADO">Finalizado</option>
        </select>

        <select id="filter-mecanico">
          <option></option>
        </select>
      </section>
      <section id="cards-grid"></section>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/drawer.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
