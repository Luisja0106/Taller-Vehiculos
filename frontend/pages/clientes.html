<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes - AutoService</title>
  <link rel="icon" type="image/webp" href="../assets/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/drawer.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/cards.css">
</head>

<body> <!--persistent objects-->
  <header> <!-- Top bar-->
    <div id="open-drawer">
      AutoService
    </div>
    <nav>
      <a id="goto-dashboard" href="#">Dashboard</a>
      <a id="goto-inventario" href="#">Inventario</a>
      <a id="goto-reportes" href="#">Reportes</a>
    </nav>
    <div>
      <span>icon</span>
      <span>UserName</span>
    </div>
  </header>

  <aside id="drawer"> <!--left bar-->
    <div>
      <span>AutoService</span>
      <button type="button" id="close-drawer">x</button>
    </div>
    <ul> <!-- list-->
      <li>
        <a id="goto-empleados" href="#">Empleados</a>
      </li>
      <li>
        <a id="goto-vehiculos" href="#">Vehiculos</a>
      </li>
      <li>
        <a id="goto-clientes" href="#">Clientes</a>
      </li>
      <li>
        <a id="goto-servicios" href="#">Servicios</a>
      </li>
    </ul>
  </aside>
  <div id="overlay"> <!--dark background in the bar--> </div>

  <main id="main-content">
    <section id="view-dashboard">
      <section class="hero" id="clientes-hero">
        <form id="search-form">
          <input type="search" id="search-input" , placeholder="buscar clientes por ID, Email">
          <button type="submit" id="button-clientes-buscar">Buscar</button>
        </form>
          <p id="search-error">Codigo No encontrado</p>
      </section>
      <div class="creacion-entidad-container" id="nuevo-cliente-container">
        <button type="button" class="creacion-entidad-button" id="nuevo-cliente-button">Nuevo cliente</button>
      </div>
      <section id="cards-grid">
      </section>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/helpers.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/drawer.js"></script>
  <script src="../js/pages/clientes.js"></script>


  <!--floating info for crear new cliente-->
  <div id="modal-overlay">
    <div class="modal-crear-entity">
        <div class="modal-header">
            <h2>Registrar Nuevo Cliente</h2>
            <button type="button" id="modal-close">✕</button>
        </div>
        <form id="form-contratar-cliente">
            <div class="form-group">
                <label for="modal-nombre">Nombre</label>
                <input type="text" id="modal-nombre" placeholder="Ingrese el Nombre del Cliente">
            </div>
            <div class="form-group">
                <label for="modal-telefono">Telefono</label>
                <input type="tel" id="modal-telefono" placeholder="Ingrese el Telefono del Cliente">
            </div>
            <div class="form-group">
                <label for="modal-email">Email</label>
                <input type="email" id="modal-email" placeholder="Ingrese el email del Cliente">
            </div>
        </form>
        <p id="modal-error" style='color: red; display: none;'></p>
        <div class="modal-footer">
            <button type="button" id="modal-cancel">Cancelar</button>
            <button type="button" id="modal-confirm">Registrar Cliente</button>
        </div>
    </div>
  </div>
  <script src="../js/usescases/registrar-cliente.js"></script>
</body>

</html>
