<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoService</title>
  <link rel="icon" type="image/webp" href="../../assets/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/detail.css">
  <link rel="stylesheet" href="../../css/drawer.css">
</head>


<body>
  <header> <!-- Top bar-->
    <div id="open-drawer">
      AutoService
    </div>
    <nav>
      <a id="goto-dashboard" href="#">Dashboard</a>
      <a id="goto-inventario" href="#">Inventario</a>
      <a id="goto-reportes" href="#">Reportes</a>
    </nav>
    <div>
      <span>icon</span>
      <span>UserName</span>
    </div>
  </header>
  <aside id="drawer"> <!--left bar-->
    <div>
      <span>AutoService</span>
      <button type="button" id="close-drawer">x</button>
    </div>
    <ul> <!-- list-->
      <li>
        <a id="goto-empleados" href="#">Empleados</a>
      </li>
      <li>
        <a id="goto-vehiculos" href="#">Vehiculos</a>
      </li>
      <li>
        <a id="goto-clientes" href="#">Clientes</a>
      </li>
      <li>
        <a id="goto-servicios" href="#">Servicios</a>
      </li>
    </ul>
  </aside>
  <div id="overlay"> <!--dark background in the bar--> </div>

  <main id="main-content">
    <section id="view-dashboard">
      <section id="order-header">
        <section class="id-bar" id="servicios-id-bar">
          <span  id="servicio-id"></span>
          <button id="close-slide" type="close">X</button>
        </section>
        <section id="hero">
          <span id="nombre-servicio-header"></span>
        </section>
      </section>
      <section id="slides">
        <section id="information" class="slide">
          <div class="title-slide">Informacion del Servicio</div>
          <div class="info-row">
            <span class="info-label">Nombre</span>
            <span class="info-result" id="nombre-servicio"></span>
          </div>
          </div>
          <div class="info-row">
            <span class="info-label">Valor</span>
            <span class="info-result" id="precio-servicio"></span>
          </div>
        </section>
        <section id="servicios" class="slide">
          <div class="title-slide">Ordenes Aplicadas</div>
          <div id="ordenes-aplicadas"></div>
        </section>
        <section id="actions" class="slide">
          <div class="title-slide">Acciones</div>
          <div id="button-grid">
            <button class="button-action" id="actualizar-servcio-btn" type="button">Actualizar Informacion</button>
          </div>
        </section>
        <button type="button" class="eliminar-entidad-btn" id="eliminar-servicio-btn">
          Eliminar Servicio 
        </button>
      </section>
    </section>
  </main>

  <div id="modal-confirmation">
    <div id="modal-confirm-box">
      <p id="modal-confirmation-messaje"></p>
      <p id="modal-confirmation-error"></p>
        <div class="modal-footer">
          <button id="modal-confirm-cancelar">Cancelar</button>
          <button id="modal-confirm-ok">Confirmar</button>
        </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/helpers.js"></script>
  <script src="../../js/navbar.js"></script>
  <script src="../../js/drawer.js"></script>
  <script src="../../js/pages/individual-pages/servicio.js"></script>
  <script src="../../js/app.js"></script>

  <div id="modal-overlay">
    <div class="modal-crear-entity">
        <div class="modal-header">
            <h2>Actualizar Servicio</h2>
            <button type="button" id="modal-close">✕</button>
        </div>
        <form id="form-crear-servicio">
            <div class="form-group">
                <label for="modal-nombre">Cambiar Nombre</label>
                <input type="text" id="modal-nombre" placeholder="Ingrese el Nombre del Servicio">
            </div>
            <div class="form-group">
                <label for="modal-precio">Cambiar Precio</label>
                <input type="number" id="modal-precio" placeholder="Ingrese el Precio del Servicio">
            </div>
        </form>
        <p id="modal-error" style='color: red; display: none;'></p>
        <div class="modal-footer-actualizar">
            <button type="button" id="modal-cancel">Cancelar</button>
            <button type="button" id="modal-confirm">Registrar Servicio</button>
        </div>
    </div>
  </div>
  <script src="../../js/usescases/actualizar-servicio.js"></script>

</body>
</html>
