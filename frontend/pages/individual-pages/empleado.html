<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoService</title>
  <link rel="icon" type="image/webp" href="../../assets/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/detail.css">
  <link rel="stylesheet" href="../../css/drawer.css">
</head>


<body>
  <header> <!-- Top bar-->
    <div id="open-drawer">
      AutoService
    </div>
    <nav>
      <a id="goto-dashboard" href="#">Dashboard</a>
      <a id="goto-inventario" href="#">Inventario</a>
      <a id="goto-reportes" href="#">Reportes</a>
    </nav>
    <div>
      <span>icon</span>
      <span>UserName</span>
    </div>
  </header>
  <aside id="drawer"> <!--left bar-->
    <div>
      <span>AutoService</span>
      <button type="button" id="close-drawer">x</button>
    </div>
    <ul> <!-- list-->
      <li>
        <a id="goto-empleados" href="#">Empleados</a>
      </li>
      <li>
        <a id="goto-vehiculos" href="#">Vehiculos</a>
      </li>
      <li>
        <a id="goto-clientes" href="#">Clientes</a>
      </li>
      <li>
        <a id="goto-servicios" href="#">Servicios</a>
      </li>
    </ul>
  </aside>
  <div id="overlay"> <!--dark background in the bar--> </div>

  <main id="main-content">
    <section id="view-dashboard">
      <section id="order-header">
        <section class="id-bar" id="empleado-id-bar">
          <span  id="empleado-id"></span>
          <button id="close-slide" type="button">X</button>
        </section>
        <section id="hero">
          <span id="nombre-empleado-header"></span>
        </section>
      </section>
      <section id="slides">
        <section id="information" class="slide">
          <div class="title-slide">Informacion del Empleado</div>
          <div class="info-row">
            <span class="info-label">Nombre del Empleado</span>
            <span class="info-result" id="nombre-empleado"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Rol</span>
            <span class="info-estado" id="rol-empleado"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Tipo de Contrato </span>
            <span class="info-result" id="contrato-empleado"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Email del empleado</span>
            <span class="info-result" id="email-empleado"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Telefono del Empleado</span>
            <span class="info-result" id="telefono-empleado"></span>
          </div>
        </section>
        <section id="servicios" class="slide">
          <div class="title-slide">Ordenes Activas</div>
          <div id="ordenes-activas"></div>
        </section>
        <section id="actions" class="slide">
          <div class="title-slide">Acciones</div>
          <div id="button-grid">
            <button class="button-action" id="actualizar-empleado-btn" type="button">Actualizar Informacion</button>
            <button class="button-action" id="ver-ordenes-pasadas-btn" type="button">Ver Ordenes Pasadas</button>
          </div>
        </section>
        <button type="button" class="eliminar-entidad-btn" id="eliminar-empleado-btn">
          Eliminar Empleado 
        </button>
      </section>
    </section>
  </main>
  
  <!-- modals -->
  <div id="modal-confirmation">
    <div id="modal-confirm-box">
      <p id="modal-confirmation-messaje"></p>
      <p id="modal-confirmation-error"></p>
        <div class="modal-footer">
          <button id="modal-confirm-cancelar">Cancelar</button>
          <button id="modal-confirm-ok">Confirmar</button>
        </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/helpers.js"></script>
  <script src="../../js/navbar.js"></script>
  <script src="../../js/drawer.js"></script>
  <script src="../../js/pages/individual-pages/empleado.js"></script>
  <script src="../../js/app.js"></script>

  <div id="modal-overlay">
    <div class="modal-crear-entity">
        <div class="modal-header">
            <h2>Actualizar Empleado</h2>
            <button type="button" id="modal-close">✕</button>
        </div>
        <form id="form-contratar-empleado">
            <div class="form-group">
                <label for="modal-nombre">Cambiar Nombre</label>
                <input type="text" id="modal-nombre" placeholder="Ingrese el Nombre del Empleado">
            </div>
            <div class="form-group">
                <label for="modal-telefono">Cambiar Telefono</label>
                <input type="tel" id="modal-telefono" placeholder="Ingrese el Telefono del Empleado">
            </div>
            <div class="form-group">
                <label for="modal-email">Cambiar Email</label>
                <input type="email" id="modal-email" placeholder="Ingrese el email del Empleado">
            </div>
            <div class="form-group">
                <label for="modal-rol">Cambiar Rol</label>
                <select id="modal-rol">
                    <option value="">Selecciona un rol</option>
                    <option value="MECANICO">Mecanico</option>
                    <option value="ADMINISTRADOR">Adminstrador</option>
                </select>
            </div>
            <div class="form-group">
                <label for="modal-contrato">Cambiar Tipo de Contrato</label>
                <select id="modal-contrato">
                    <option value="">Selecciona un Tipo de Contrato</option>
                    <option value="FIJO">Fijo</option>
                    <option value="PARCIAL">Parcial</option>
                </select>
            </div>
        </form>
        <p id="modal-error" style='color: red; display: none;'></p>
        <div class="modal-footer-actualizar">
            <button type="button" id="modal-cancel">Cancelar</button>
            <button type="button" id="modal-confirm">Actualizar Empleado</button>
        </div>
    </div>
  </div>
  <script src="../../js/usescases/actualizar-empleado.js"></script>

  <div id="ordenes-finalizadas-modal">
    <div id="ordenes-finalizadas-content">
      <div id="ordenes-finalizadas-header">
        <h2>Ordenes Finalizadas</h2>
        <button type="button" id="close-ordenes-finalizadas-btn">X</button>
      </div>
      <nav id="ordenes-finalizadas-nav">
        <ul id="ordenes-finalizadas-list"></ul>
      </nav>
    </div>
  </div>
  <script src="../../js/usescases/cargar-ordenes-finalizadas.js"></script>

</body>
</html>
