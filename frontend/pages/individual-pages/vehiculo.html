<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoService</title>
  <link rel="icon" type="image/webp" href="../../assets/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/detail.css">
  <link rel="stylesheet" href="../../css/drawer.css">
</head>


<body>
  <header> <!-- Top bar-->
    <div id="open-drawer">
      AutoService
    </div>
    <nav>
      <a id="goto-dashboard" href="#">Dashboard</a>
      <a id="goto-inventario" href="#">Inventario</a>
      <a id="goto-reportes" href="#">Reportes</a>
    </nav>
    <div>
      <span>icon</span>
      <span>UserName</span>
    </div>
  </header>
  <aside id="drawer"> <!--left bar-->
    <div>
      <span>AutoService</span>
      <button type="button" id="close-drawer">x</button>
    </div>
    <ul> <!-- list-->
      <li>
        <a id="goto-empleados" href="#">Empleados</a>
      </li>
      <li>
        <a id="goto-vehiculos" href="#">Vehiculos</a>
      </li>
      <li>
        <a id="goto-clientes" href="#">Clientes</a>
      </li>
      <li>
        <a id="goto-servicios" href="#">Servicios</a>
      </li>
    </ul>
  </aside>
  <div id="overlay"> <!--dark background in the bar--> </div>

  <main id="main-content">
    <section id="view-dashboard">
      <section id="order-header">
        <section class="id-bar" id="vehiculos-id-bar">
          <span  id="vehiculo-id"></span>
          <button id="close-slide" type="button">X</button>
        </section>
        <section id="hero">
          <span id="modelo-vehiculo-header"></span>
        </section>
      </section>
      <section id="slides">
        <section id="information" class="slide">
          <div class="title-slide">Informacion del Vehiculo</div>
          <div class="info-row">
            <span class="info-label">Modelo del vehiculo</span>
            <span class="info-result" id="modelo-vehiculo"></span>
          </div>
          </div>
          <div class="info-row">
            <span class="info-label">Placa del Vehiculo</span>
            <span class="info-result" id="placa-vehiculo"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Propietario/a</span>
            <a class="info-estado" id="dueño-vehiculo" href="#"></a>
          </div>
          <div class="info-row">
            <span class="info-label">Año</span>
            <span class="info-result" id="anio-vehiculo"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Marca</span>
            <span class="info-result" id="marca-vehiculo"></span>
          </div>
        </section>
        <section id="servicios" class="slide">
          <div class="title-slide">Ordenes Activas</div>
          <div id="ordenes-activas"></div>
        </section>
        <section id="actions" class="slide">
          <div class="title-slide">Acciones</div>
          <div id="button-grid">
            <button class="button-action" id="actualizar-vehiculo-btn" type="button">Actualizar Informacion</button>
            <button class="button-action" type="button">Ver Ordenes Pasadas</button>
          </div>
        </section>
        <button type="button" class="eliminar-entidad-btn", id="eliminar-vehiculo-btn">
          Eliminar Vehiculo
        </button>
      </section>
    </section>
  </main>

  <!-- modals -->
  <div id="modal-confirmation">
    <div id="modal-confirm-box">
      <p id="modal-confirmation-messaje"></p>
      <p id="modal-confirmation-error"></p>
        <div class="modal-footer">
          <button id="modal-confirm-cancelar">Cancelar</button>
          <button id="modal-confirm-ok">Confirmar</button>
        </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/helpers.js"></script>
  <script src="../../js/navbar.js"></script>
  <script src="../../js/drawer.js"></script>
  <script src="../../js/pages/individual-pages/vehiculo.js"></script>
  <script src="../../js/app.js"></script>


  <div id="modal-overlay">
    <div class="modal-crear-entity">
        <div class="modal-header">
            <h2>Actualizar Vehiculo</h2>
            <button type="button" id="modal-close">✕</button>
        </div>
        <form id="form-contratar-empleado">
            <div class="form-group">
                <label for="modal-propietario">Cambiar Propietario/a</label>
                <select id="modal-propietario">
                    <option value="">Seleccion un Propietario</option>
                </select>
            </div>
            <div class="form-group">
                <label for="modal-modelo">Cambiar Modelo</label>
                <input type="text" id="modal-modelo" placeholder="Ingrese el Modelo del Vehiculo">
            </div>
            <div class="form-group">
                <label for="modal-marca">Cambiar Marca</label>
                <select id="modal-marca">
                    <option value="">Selecciona una Marca</option>
                    <option value="CHEVROLET">Chevrolet</option>
                    <option value="MAZDA">Mazda</option>
                    <option value="TOYOTA">Toyota</option>
                    <option value="RENAULT">Renault</option>
                    <option value="KIA">Kia</option>
                </select>
            </div>
            <div class="form-group">
                <label for="modal-anio">Cambiar Año</label>
                <input type="number" id="modal-anio" min="1900" max="3000" placeholder="Ingrese el Año del Vehiculo">
            </div>
        </form>
        <p id="modal-error" style='color: red; display: none;'></p>
        <div class="modal-footer-actualizar">
            <button type="button" id="modal-cancel">Cancelar</button>
            <button type="button" id="modal-confirm">Actualizar Vehiculo</button>
        </div>
    </div>
  </div>
  <script src="../../js/usescases/actualizar-vehiculo.js"></script>

</body>
</html>
